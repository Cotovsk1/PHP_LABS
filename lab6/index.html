<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулінарна книга — API (Практична №6)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-content">
                <div>
                    <span class="header-badge" style="background:#f97316; color:white; padding:4px 10px; border-radius:20px; font-size:0.75rem;">Практична №6 · REST API</span>
                    <h1>Кулінарна книга (API)</h1>
                    <p class="subtitle">Єдина точка входу: <code>api.php?resource=recipes</code></p>
                </div>
            </div>
            <div>
                <a href="setup.php" class="btn btn-secondary" style="text-decoration:none; font-size:0.9rem;">⚙️ Setup БД</a>
            </div>
        </header>

        <!-- Пошук / Фільтрація за часом (Доменна дія action=search) -->
        <section class="form-card">
            <h2>🔍 Доменна дія: Пошук за максимальним часом (action=search)</h2>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="number" id="maxTimeInput" class="form-control" placeholder="Макс. час приготування (хв), напр. 25" style="margin-bottom:0;">
                <button type="button" id="searchBtn" class="btn btn-primary">Знайти</button>
                <button type="button" id="resetSearchBtn" class="btn btn-secondary">Всі</button>
            </div>
        </section>

        <!-- Форма додавання (POST) -->
        <section class="form-card">
            <h2>➕ Додати новий рецепт (POST /api.php?resource=recipes)</h2>
            <form id="addForm" style="margin-top: 15px;">
                <input type="text" id="title" class="form-control" placeholder="Назва страви" required>
                <input type="text" id="ingredients" class="form-control" placeholder="Інгредієнти через кому" required>
                <input type="number" id="cook_time_min" class="form-control" placeholder="Час приготування (хв)" min="1" required>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Створити запис (POST)</button>
            </form>
        </section>

        <!-- Результати -->
        <section class="results-section">
            <h2 class="section-title">📋 Список рецептів від API</h2>
            <div id="resultsContainer">
                <p>Завантаження...</p>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadRecipes();

            const addForm = document.getElementById('addForm');
            addForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    title: document.getElementById('title').value.trim(),
                    ingredients: document.getElementById('ingredients').value.trim(),
                    cook_time_min: parseInt(document.getElementById('cook_time_min').value)
                };

                try {
                    const res = await fetch('api.php?resource=recipes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const json = await res.json();
                    if (!res.ok) {
                        throw new Error(json.error || 'Помилка створення');
                    }
                    addForm.reset();
                    loadRecipes();
                    alert('Рецепт успішно створено (Код 201 Created)!');
                } catch (err) {
                    alert('Помилка: ' + err.message);
                }
            });

            document.getElementById('searchBtn').addEventListener('click', async () => {
                const maxTime = document.getElementById('maxTimeInput').value.trim();
                if (!maxTime) {
                    alert('Введіть максимальний час!');
                    return;
                }
                try {
                    const res = await fetch(`api.php?resource=recipes&action=search&max_time=${maxTime}`);
                    const json = await res.json();
                    if (!json.success) throw new Error(json.error);
                    renderRecipes(json.data);
                } catch (err) {
                    alert('Помилка пошуку: ' + err.message);
                }
            });

            document.getElementById('resetSearchBtn').addEventListener('click', () => {
                document.getElementById('maxTimeInput').value = '';
                loadRecipes();
            });
        });

        async function loadRecipes() {
            try {
                const res = await fetch('api.php?resource=recipes');
                const json = await res.json();
                if (!json.success) throw new Error(json.error);
                renderRecipes(json.data);
            } catch (err) {
                document.getElementById('resultsContainer').innerHTML = `<p style="color:red">Помилка завантаження: ${err.message}. Перевірте чи ініціалізовано БД через <a href="setup.php">setup.php</a>.</p>`;
            }
        }

        function renderRecipes(recipes) {
            const container = document.getElementById('resultsContainer');
            if (!recipes || recipes.length === 0) {
                container.innerHTML = '<p class="empty-msg">Рецептів не знайдено.</p>';
                return;
            }

            let html = '<table class="recipes-table"><thead><tr><th>ID</th><th>Назва</th><th>Інгредієнти</th><th>Час (хв)</th></tr></thead><tbody>';
            recipes.forEach(r => {
                html += `<tr>
                    <td>${r.id}</td>
                    <td><strong>${escapeHtml(r.title)}</strong></td>
                    <td>${escapeHtml(r.ingredients)}</td>
                    <td><span style="background:${r.cook_time_min <= 20 ? '#dcfce7;color:#166534' : '#f1f5f9;color:#475569'}; padding:4px 8px; border-radius:6px; font-weight:600;">${r.cook_time_min} хв</span></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
